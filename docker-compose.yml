services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: obsevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obsevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsevo}
      POSTGRES_DB: ${POSTGRES_DB:-obsevo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obsevo} -d ${POSTGRES_DB:-obsevo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis
  redis:
    image: redis:7-alpine
    container_name: obsevo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # Go API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsevo-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-obsevo}:${POSTGRES_PASSWORD:-obsevo}@postgres:5432/${POSTGRES_DB:-obsevo}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # SvelteKit Frontend (dev mode)
  web:
    image: node:22-alpine
    container_name: obsevo-web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
